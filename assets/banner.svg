<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="256" viewBox="0 0 1024 256" fill="none">
  <rect x="1" y="1" width="1022" height="254" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Kicker superior esquerdo -->
  <g transform="translate(56, 46)">
    <g stroke="#3f7bde" stroke-width="2.6" stroke-linecap="round">
      <line x1="9" y1="1.5" x2="9" y2="16.5"/>
      <line x1="1.5" y1="9" x2="16.5" y2="9"/>
      <line x1="3.7" y1="3.7" x2="14.3" y2="14.3"/>
      <line x1="14.3" y1="3.7" x2="3.7" y2="14.3"/>
    </g>
    <text x="28" y="13.5" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="400" fill="#000000" letter-spacing="-0.2">PyStSlides</text>
  </g>

  <!-- Título e subtítulo editoriais -->
  <text x="56" y="146" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="68" font-weight="400" fill="#000000" letter-spacing="-2.4">PyStSlides</text>
  <text x="58" y="190" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="400" fill="#52525b" letter-spacing="-0.2">Apresentações técnicas em código com Python, POO e Streamlit</text>

  <!-- Ilustração geométrica flat à direita -->
  <g transform="translate(650, 28)">
    <!-- Card minimalista de slide -->
    <rect x="132" y="16" width="186" height="114" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <rect x="150" y="36" width="64" height="10" rx="4" fill="#3f7bde"/>
    <rect x="150" y="54" width="24" height="10" rx="4" fill="#579568"/>
    <rect x="180" y="54" width="34" height="10" rx="4" fill="#3f7bde"/>
    <rect x="150" y="92" width="44" height="8" rx="4" fill="#579568"/>
    <circle cx="268" cy="73" r="28" stroke="#e19b4d" stroke-width="5"/>
    <path d="M256 73l8 8 16-16" stroke="#e19b4d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Barras verticais flat -->
    <rect x="12" y="42" width="36" height="92" rx="6" fill="#3f7bde"/>
    <rect x="58" y="14" width="36" height="120" rx="6" fill="#e19b4d"/>
    <rect x="104" y="68" width="36" height="66" rx="6" fill="#579568"/>

