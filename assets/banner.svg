    <circle cx="114" cy="96" r="42" stroke="#3f7bde" stroke-width="10"/>
    <line x1="114" y1="138" x2="114" y2="190" stroke="#3f7bde" stroke-width="11" stroke-linecap="round"/>

    <!-- Nós conectados violeta e âmbar -->
    <circle cx="242" cy="158" r="16" fill="#8461f0"/>
    <circle cx="204" cy="186" r="11" fill="#e19b4d"/>
    <circle cx="282" cy="186" r="11" fill="#579568"/>
    <line x1="229" y1="168" x2="213" y2="179" stroke="#000000" stroke-width="1.8"/>
    <line x1="255" y1="168" x2="273" y2="179" stroke="#000000" stroke-width="1.8"/>

    <!-- Estrela 4 pontas -->
    <path d="M180 144l3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7z" stroke="#e19b4d" stroke-width="1.6" fill="none"/>
  </g>
