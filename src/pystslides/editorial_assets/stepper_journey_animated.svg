<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <style>
    .conn { stroke-dasharray: 6 6; animation: stepFlow 1.8s linear infinite; }
    .step { animation: stepPulse 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 0.55s; }
    .s3 { animation-delay: 1.1s; }
    @keyframes stepFlow {
      to { stroke-dashoffset: -24; }
    }
    @keyframes stepPulse {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(1.07); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="48" y="64" width="384" height="232" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line class="conn" x1="146" y1="162" x2="210" y2="162" stroke="#000000" stroke-width="2.2"/>
  <line class="conn" x1="270" y1="162" x2="334" y2="162" stroke="#000000" stroke-width="2.2"/>

  <g class="step s1">
    <circle cx="116" cy="162" r="30" fill="#3f7bde"/>
    <text x="116" y="169" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="19" font-weight="500" fill="#ffffff">01</text>
  </g>

  <g class="step s2">
    <circle cx="240" cy="162" r="30" fill="#e19b4d"/>
    <text x="240" y="169" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="19" font-weight="500" fill="#ffffff">02</text>
  </g>

  <g class="step s3">
    <circle cx="364" cy="162" r="30" fill="#579568"/>
    <text x="364" y="169" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="19" font-weight="500" fill="#ffffff">03</text>
  </g>

  <rect x="82" y="222" width="68" height="10" rx="5" fill="#000000"/>
  <rect x="206" y="222" width="68" height="10" rx="5" fill="#52525b"/>
  <rect x="330" y="222" width="68" height="10" rx="5" fill="#52525b"/>
</svg>
