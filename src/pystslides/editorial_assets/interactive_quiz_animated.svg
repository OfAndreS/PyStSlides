<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <style>
    .opt-bg { animation: optGlow 2.8s ease-in-out infinite; }
    .chk { animation: chkPulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .accent-dot { animation: dotFloat 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes optGlow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes chkPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes dotFloat {
      0%, 100% { transform: scale(0.92); }
      50% { transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <!-- Cartão principal de questionário -->
  <rect x="64" y="54" width="352" height="252" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Cabeçalho do quiz -->
  <circle cx="96" cy="92" r="7" fill="#3f7bde"/>
  <rect x="116" y="86" width="172" height="12" rx="6" fill="#000000"/>

  <!-- Opção 1 inativa -->
  <circle cx="102" cy="142" r="11" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="128" y="137" width="190" height="10" rx="5" fill="#e5e7eb"/>

  <!-- Opção 2 selecionada e correta -->
  <rect class="opt-bg" x="82" y="170" width="316" height="52" rx="10" fill="#eef6f0"/>
  <g class="chk">
    <circle cx="106" cy="196" r="12" fill="#579568"/>
    <path d="M100 196l4 4 8-8" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="132" y="191" width="186" height="10" rx="5" fill="#1c4529"/>

  <!-- Botão pílula inferior -->
  <rect x="82" y="242" width="136" height="36" rx="18" fill="#000000"/>
  <rect x="108" y="256" width="84" height="8" rx="4" fill="#ffffff"/>

  <!-- Acento decorativo -->
  <circle class="accent-dot" cx="386" cy="92" r="14" fill="#e19b4d"/>
</svg>
