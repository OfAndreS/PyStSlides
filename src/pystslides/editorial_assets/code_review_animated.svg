<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <style>
    .code-line { animation: linePulse 3s ease-in-out infinite; }
    .l1 { animation-delay: 0s; }
    .l2 { animation-delay: 0.45s; }
    .l3 { animation-delay: 0.9s; }
    .seal { animation: sealPulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes linePulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    @keyframes sealPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <!-- Janela de código limpa -->
  <rect x="64" y="64" width="352" height="232" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line x1="64" y1="108" x2="416" y2="108" stroke="#000000" stroke-width="1.8"/>
  <circle cx="92" cy="86" r="6" fill="#e19b4d"/>
  <circle cx="114" cy="86" r="6" fill="#3f7bde"/>
  <circle cx="136" cy="86" r="6" fill="#579568"/>

  <!-- Linhas de código coloridas -->
  <rect class="code-line l1" x="96" y="136" width="76" height="10" rx="5" fill="#8461f0"/>
  <rect x="184" y="136" width="112" height="10" rx="5" fill="#e5e7eb"/>
  <rect class="code-line l2" x="120" y="164" width="94" height="10" rx="5" fill="#3f7bde"/>
  <rect class="code-line l2" x="226" y="164" width="68" height="10" rx="5" fill="#e19b4d"/>
  <rect x="120" y="192" width="144" height="10" rx="5" fill="#e5e7eb"/>
  <rect class="code-line l3" x="96" y="220" width="84" height="10" rx="5" fill="#579568"/>
  <rect x="192" y="220" width="96" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="96" y="248" width="128" height="10" rx="5" fill="#e5e7eb"/>

  <!-- Selo verde de aprovação -->
  <g class="seal">
    <circle cx="380" cy="256" r="34" fill="#579568"/>
    <path d="M366 256l10 10 18-20" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
