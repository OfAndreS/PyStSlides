<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <style>
    .span { animation: spanPulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    .sp1 { animation-delay: 0s; }
    .sp2 { animation-delay: 0.3s; }
    .sp3 { animation-delay: 0.6s; }
    .sp4 { animation-delay: 0.9s; }
    .anomaly { animation: anomalyPulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spanPulse {
      0%, 100% { transform: scaleX(0.96); opacity: 0.85; }
      50% { transform: scaleX(1); opacity: 1; }
    }
    @keyframes anomalyPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <!-- Painel de traces distribuídos -->
  <rect x="48" y="58" width="384" height="244" rx="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line x1="168" y1="84" x2="168" y2="276" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="278" y1="84" x2="278" y2="276" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Spans horizontais de latência -->
  <rect class="span sp1" x="78" y="96" width="318" height="22" rx="11" fill="#3f7bde"/>
  <rect class="span sp2" x="116" y="138" width="154" height="22" rx="11" fill="#579568"/>
  <rect class="span sp3" x="176" y="180" width="182" height="22" rx="11" fill="#8461f0"/>
  <rect class="span sp4" x="266" y="222" width="128" height="22" rx="11" fill="#e19b4d"/>

  <!-- Ponto de anomalia -->
  <g class="anomaly">
    <circle cx="378" cy="233" r="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <circle cx="378" cy="233" r="7" fill="#e19b4d"/>
  </g>
</svg>
