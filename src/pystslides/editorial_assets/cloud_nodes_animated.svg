<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <style>
    .cloud { animation: cloudFloat 3.6s ease-in-out infinite; }
    .link { stroke-dasharray: 6 6; animation: linkFlow 1.8s linear infinite; }
    .core { animation: corePulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .qbar { animation: barGlow 2.4s ease-in-out infinite; }
    .q2 { animation-delay: 0.4s; }
    .q3 { animation-delay: 0.8s; }
    @keyframes cloudFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes linkFlow {
      to { stroke-dashoffset: -24; }
    }
    @keyframes corePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }
    @keyframes barGlow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <!-- Nuvem azul flat -->
  <g class="cloud">
    <path d="M168 134h144c26 0 46-19 46-44 0-23-17-42-40-44-8-26-32-44-60-44-34 0-62 26-64 60-20 4-36 21-36 42 0 17 4 30 10 30z" transform="translate(0 30)" fill="#3f7bde"/>
  </g>

  <!-- Linhas de conexão -->
  <line class="link" x1="240" y1="164" x2="118" y2="230" stroke="#000000" stroke-width="2.2"/>
  <line class="link" x1="240" y1="164" x2="240" y2="230" stroke="#000000" stroke-width="2.2"/>
  <line class="link" x1="240" y1="164" x2="362" y2="230" stroke="#000000" stroke-width="2.2"/>

  <!-- Cilindro BD verde -->
  <rect x="74" y="230" width="88" height="76" rx="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <ellipse cx="118" cy="242" rx="44" ry="12" fill="#579568" stroke="#000000" stroke-width="2"/>
  <line x1="94" y1="272" x2="142" y2="272" stroke="#579568" stroke-width="5" stroke-linecap="round"/>
  <line x1="94" y1="288" x2="128" y2="288" stroke="#e19b4d" stroke-width="5" stroke-linecap="round"/>

  <!-- Nó API âmbar -->
  <rect x="196" y="230" width="88" height="76" rx="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="240" cy="268" r="20" fill="#e19b4d"/>
  <circle class="core" cx="240" cy="268" r="7" fill="#ffffff"/>

  <!-- Serviço fila violeta -->
  <rect x="318" y="230" width="88" height="76" rx="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect class="qbar" x="336" y="250" width="52" height="10" rx="5" fill="#8461f0"/>
  <rect class="qbar q2" x="336" y="268" width="38" height="10" rx="5" fill="#3f7bde"/>
  <rect class="qbar q3" x="336" y="286" width="46" height="10" rx="5" fill="#579568"/>
</svg>
